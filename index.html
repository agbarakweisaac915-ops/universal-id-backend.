<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal ID Protocol Router</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: #111827;
            padding: 28px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 460px;
            border: 1px solid #1f2937;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #374151;
        }
        .tab {
            flex: 1;
            padding: 10px 4px;
            text-align: center;
            cursor: pointer;
            color: #9ca3af;
            font-weight: 600;
            border-bottom: 2px solid transparent;
            font-size: 0.82rem;
            white-space: nowrap;
        }
        .tab.active {
            color: #38bdf8;
            border-bottom: 2px solid #38bdf8;
        }
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 1.25rem;
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #9ca3af;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 14px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
            font-size: 0.9rem;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 11px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.9rem;
        }
        button:hover {
            background-color: #0369a1;
        }
        .result, .status {
            margin-top: 15px;
            padding: 12px;
            background-color: #1f2937;
            border-radius: 6px;
            font-size: 0.85rem;
        }
        .destination-card {
            background: #1f2937;
            border: 1px solid #374151;
            padding: 10px 12px;
            margin-top: 8px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .destination-card:hover {
            border-color: #38bdf8;
            background: #1e293b;
        }
        .dest-info {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 290px;
        }
        .dest-badge {
            font-size: 0.7rem;
            background: #0284c7;
            color: #fff;
            padding: 3px 8px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
            margin-left: 8px;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <div class="tab active" onclick="switchTab('resolve')">⚡ Resolve</div>
        <div class="tab" onclick="switchTab('register')">🔑 Register</div>
        <div class="tab" onclick="switchTab('link')">🔗 Link More</div>
        <div class="tab" onclick="switchTab('sync')">🔄 Auto-Sync</div>
    </div>

    <!-- RESOLVE & SEND TAB -->
    <div id="resolve-section" class="form-section active">
        <h2>Send via Universal ID</h2>
        <label>Recipient Handle</label>
        <input type="text" id="resolveHandle" placeholder="e.g. dev_mark">
        <button onclick="resolveHandle()">Lookup Destinations</button>
        
        <div id="resolveResult" class="result hidden"></div>

        <div id="selectedTargetContainer" class="hidden" style="margin-top: 15px;">
            <label>Selected Destination Route</label>
            <input type="text" id="autoFilledAddress" readonly placeholder="Tap a destination card below..." style="background-color: #064e3b; border-color: #059669; color: #6ee7b7; font-family: monospace;">
            <button style="background-color: #059669;" onclick="alert('Ready to execute transfer to target route!')">Proceed with Transfer 🚀</button>
        </div>
    </div>

    <!-- REGISTER TAB -->
    <div id="register-section" class="form-section">
        <h2>Claim Universal ID</h2>
        <label>Choose @Handle</label>
        <input type="text" id="regHandle" placeholder="e.g. alex">
        <label>EVM Address (Optional)</label>
        <input type="text" id="regEvm" placeholder="0x...">
        <label>Solana Address (Optional)</label>
        <input type="text" id="regSol" placeholder="Solana Wallet Pubkey">
        <label>CEX / Exchange Account ID (Optional)</label>
        <input type="text" id="regOkx" placeholder="Master Exchange UID">
        <button onclick="registerPasskey()">Create Passkey & Save</button>
        <div id="regStatus" class="status hidden"></div>
    </div>

    <!-- LINK MORE TAB -->
    <div id="link-section" class="form-section">
        <h2>Link Wallet / Exchange</h2>
        <label>Your Master Handle</label>
        <input type="text" id="linkHandle" placeholder="e.g. dev_mark">
        <label>Chain / Type (evm, solana, btc, or exchange name)</label>
        <input type="text" id="linkChain" placeholder="e.g. evm">
        <label>Wallet Address or CEX UID</label>
        <input type="text" id="linkAddress" placeholder="Address or Exchange ID">
        <button onclick="linkWallet()">Authenticate & Link</button>
        <div id="linkStatus" class="status hidden"></div>
    </div>

    <!-- AUTO-SYNC TAB -->
    <div id="sync-section" class="form-section">
        <h2>Auto-Sync Exchange Wallets</h2>
        <label>Your Master Handle</label>
        <input type="text" id="syncHandle" placeholder="e.g. dev_mark">
        <label>Exchange Identifier</label>
        <input type="text" id="syncExchange" placeholder="e.g. okx, binance, bitget, bybit">
        <label>Exchange API Key</label>
        <input type="password" id="syncApiKey" placeholder="Paste API Key">
        <button onclick="syncExchange()">Auto-Fetch Addresses</button>
        <div id="syncStatus" class="status hidden"></div>
    </div>
</div>

<script>
    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
        
        const tabs = {'resolve': 0, 'register': 1, 'link': 2, 'sync': 3};
        document.querySelectorAll('.tab')[tabs[tabName]].classList.add('active');
        document.getElementById(`${tabName}-section`).classList.add('active');
    }

    async function resolveHandle() {
        const handle = document.getElementById('resolveHandle').value.trim();
        const resultDiv = document.getElementById('resolveResult');
        const targetContainer = document.getElementById('selectedTargetContainer');
        
        if (!handle) return;

        resultDiv.classList.remove('hidden');
        resultDiv.innerHTML = "Resolving recipient profile...";
        targetContainer.classList.add('hidden');

        try {
            const res = await fetch(`/api/v1/resolve?handle=${encodeURIComponent(handle)}`);
            const data = await res.json();

            if (res.ok) {
                let cardsHtml = `<div style="margin-bottom: 8px; font-weight: bold; color: #38bdf8;">Tap a destination to auto-fill:</div>`;
                
                for (const [key, val] of Object.entries(data.destinations)) {
                    cardsHtml += `
                        <div class="destination-card" onclick="selectDestination('${key}', '${val}')">
                            <div class="dest-info">
                                <span style="font-size: 0.7rem; color: #9ca3af; display: block; font-weight: bold;">${key.toUpperCase()}</span>
                                <span style="font-family: monospace; font-size: 0.85rem;">${val}</span>
                            </div>
                            <span class="dest-badge">Select</span>
                        </div>
                    `;
                }
                resultDiv.innerHTML = cardsHtml;
            } else {
                resultDiv.innerHTML = `<span style="color: #ef4444;">${data.error}</span>`;
            }
        } catch (err) {
            resultDiv.innerHTML = `<span style="color: #ef4444;">Resolution network error.</span>`;
        }
    }

    function selectDestination(type, address) {
        const targetInput = document.getElementById('autoFilledAddress');
        const targetContainer = document.getElementById('selectedTargetContainer');
        
        targetInput.value = `[${type.toUpperCase()}] ${address}`;
        targetContainer.classList.remove('hidden');
    }

    async function registerPasskey() {
        const handle = document.getElementById('regHandle').value.trim();
        const evm_address = document.getElementById('regEvm').value.trim();
        const solana_address = document.getElementById('regSol').value.trim();
        const okx_uid = document.getElementById('regOkx').value.trim();
        const statusDiv = document.getElementById('regStatus');

        if (!handle) { alert("Please enter a handle."); return; }

        statusDiv.classList.remove('hidden');
        statusDiv.innerHTML = "Prompting hardware Passkey authentication...";

        try {
            const challenge = new Uint8Array(32);
            window.crypto.getRandomValues(challenge);
            const userId = new Uint8Array(16);
            window.crypto.getRandomValues(userId);

            const credential = await navigator.credentials.create({
                publicKey: {
                    challenge: challenge,
                    rp: { name: "Universal ID Protocol", id: window.location.hostname },
                    user: { id: userId, name: handle, displayName: `@${handle}` },
                    pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                    timeout: 60000,
                    attestation: "direct"
                }
            });

            const credentialIdBase64 = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));
            statusDiv.innerHTML = "Saving handle to database...";

            const response = await fetch('/api/v1/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    handle,
                    owner_credential_id: credentialIdBase64,
                    passkey_public_key: "stored_passkey_placeholder",
                    evm_address: evm_address || null,
                    solana_address: solana_address || null,
                    okx_uid: okx_uid || null
                })
            });

            const data = await response.json();
            if (response.ok) {
                statusDiv.innerHTML = `<span style="color: #22c55e;">🎉 Successfully claimed @${data.handle} with Passkey!</span>`;
            } else {
                statusDiv.innerHTML = `<span style="color: #ef4444;">${data.error}</span>`;
            }
        } catch (err) {
            statusDiv.innerHTML = `<span style="color: #ef4444;">Passkey registration failed or cancelled.</span>`;
        }
    }

    async function linkWallet() {
        const handle = document.getElementById('linkHandle').value.trim();
        const chain_type = document.getElementById('linkChain').value.trim();
        const wallet_address = document.getElementById('linkAddress').value.trim();
        const statusDiv = document.getElementById('linkStatus');

        if (!handle || !chain_type || !wallet_address) { alert("Please fill in all fields."); return; }

        statusDiv.classList.remove('hidden');
        statusDiv.innerHTML = "Authenticating with Passkey to authorize link...";

        try {
            const challenge = new Uint8Array(32);
            window.crypto.getRandomValues(challenge);

            const assertion = await navigator.credentials.get({
                publicKey: { challenge: challenge, timeout: 60000, userVerification: "required" }
            });

            const credentialIdBase64 = btoa(String.fromCharCode(...new Uint8Array(assertion.rawId)));
            statusDiv.innerHTML = "Linking address to handle...";

            const response = await fetch('/api/v1/link-wallet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ handle, chain_type, wallet_address, owner_credential_id: credentialIdBase64 })
            });

            const data = await response.json();
            if (response.ok) {
                statusDiv.innerHTML = `<span style="color: #22c55e;">✅ ${data.message}</span>`;
            } else {
                statusDiv.innerHTML = `<span style="color: #ef4444;">${data.error}</span>`;
            }
        } catch (err) {
            statusDiv.innerHTML = `<span style="color: #ef4444;">Authentication failed or cancelled.</span>`;
        }
    }

    async function syncExchange() {
        const handle = document.getElementById('syncHandle').value.trim();
        const exchange_name = document.getElementById('syncExchange').value.trim();
        const api_key = document.getElementById('syncApiKey').value.trim();
        const statusDiv = document.getElementById('syncStatus');

        if (!handle || !exchange_name || !api_key) { alert("Please fill in all fields."); return; }

        statusDiv.classList.remove('hidden');
        statusDiv.innerHTML = "Auto-fetching deposit addresses from exchange API...";

        try {
            const response = await fetch('/api/v1/sync-exchange', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ handle, exchange_name, api_key })
            });

            const data = await response.json();
            if (response.ok) {
                statusDiv.innerHTML = `<span style="color: #22c55e;">✅ ${data.message}</span>`;
            } else {
                statusDiv.innerHTML = `<span style="color: #ef4444;">${data.error}</span>`;
            }
        } catch (err) {
            statusDiv.innerHTML = `<span style="color: #ef4444;">Sync network error.</span>`;
        }
    }
</script>

</body>
</html>
