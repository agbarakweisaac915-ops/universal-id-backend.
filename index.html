<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal ID Router</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #111827;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 420px;
            border: 1px solid #1f2937;
        }
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid #374151;
        }
        .tab {
            flex: 1;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            color: #9ca3af;
            font-weight: 600;
            border-bottom: 2px solid transparent;
        }
        .tab.active {
            color: #38bdf8;
            border-bottom: 2px solid #38bdf8;
        }
        .form-section {
            display: none;
        }
        .form-section.active {
            display: block;
        }
        h2 {
            margin-top: 0;
            color: #38bdf8;
            font-size: 1.25rem;
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #9ca3af;
            margin-bottom: 5px;
        }
        input {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            background-color: #1f2937;
            border: 1px solid #374151;
            border-radius: 6px;
            color: #fff;
            box-sizing: border-box;
        }
        input:focus {
            outline: none;
            border-color: #38bdf8;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #0284c7;
        }
        .result, .status {
            margin-top: 15px;
            padding: 10px;
            background-color: #1f2937;
            border-radius: 6px;
            font-size: 0.85rem;
            word-break: break-all;
        }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <div class="tabs">
        <div class="tab active" onclick="switchTab('resolve')">⚡ Resolve</div>
        <div class="tab" onclick="switchTab('register')">🔑 Register</div>
        <div class="tab" onclick="switchTab('link')">🔗 Link More</div>
    </div>

    <!-- RESOLVE TAB -->
    <div id="resolve-section" class="form-section active">
        <h2>Resolve Universal ID</h2>
        <label>Withdrawal Recipient (@handle)</label>
        <input type="text" id="resolveHandle" placeholder="e.g. dev_mark">
        <button onclick="resolveHandle()">Resolve Address</button>
        <div id="resolveResult" class="result hidden"></div>
    </div>

    <!-- REGISTER TAB -->
    <div id="register-section" class="form-section">
        <h2>Claim Universal ID</h2>
        <label>Choose @Handle</label>
        <input type="text" id="regHandle" placeholder="e.g. alex">
        <label>EVM Address (Optional)</label>
        <input type="text" id="regEvm" placeholder="0x...">
        <label>Solana Address (Optional)</label>
        <input type="text" id="regSol" placeholder="Solana Wallet Pubkey">
        <label>Exchange UID (Optional)</label>
        <input type="text" id="regOkx" placeholder="Exchange UID (e.g., OKX)">
        <button onclick="registerPasskey()">Create Passkey & Save</button>
        <div id="regStatus" class="status hidden"></div>
    </div>

    <!-- LINK MORE TAB -->
    <div id="link-section" class="form-section">
        <h2>Link Wallet / Exchange</h2>
        <label>Your Master Handle</label>
        <input type="text" id="linkHandle" placeholder="e.g. dev_mark">
        <label>Chain / Type (evm, solana, btc, okx)</label>
        <input type="text" id="linkChain" placeholder="e.g. evm">
        <label>Wallet Address or UID</label>
        <input type="text" id="linkAddress" placeholder="Address or Exchange ID">
        <button onclick="linkWallet()">Authenticate & Link</button>
        <div id="linkStatus" class="status hidden"></div>
    </div>
</div>

<script>
    function switchTab(tabName) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form-section').forEach(s => s.classList.remove('active'));
        
        if (tabName === 'resolve') {
            document.querySelectorAll('.tab')[0].classList.add('active');
            document.getElementById('resolve-section').classList.add('active');
        } else if (tabName === 'register') {
            document.querySelectorAll('.tab')[1].classList.add('active');
            document.getElementById('register-section').classList.add('active');
        } else if (tabName === 'link') {
            document.querySelectorAll('.tab')[2].classList.add('active');
            document.getElementById('link-section').classList.add('active');
        }
    }

    async function resolveHandle() {
        const handle = document.getElementById('resolveHandle').value.trim();
        const resultDiv = document.getElementById('resolveResult');
        if (!handle) return;

        resultDiv.classList.remove('hidden');
        resultDiv.innerHTML = "Resolving...";

        try {
            const res = await fetch(`/api/v1/resolve?handle=${encodeURIComponent(handle)}`);
            const data = await res.json();

            if (res.ok) {
                let destHtml = '';
                for (const [key, val] of Object.entries(data.destinations)) {
                    destHtml += `<div><strong>${key.toUpperCase()}:</strong> ${val}</div>`;
                }
                resultDiv.innerHTML = `<div><strong>Handle:</strong> @${data.handle}</div>${destHtml}`;
            } else {
                resultDiv.innerHTML = `<span style="color: #ef4444;">${data.error}</span>`;
            }
        } catch (err) {
            resultDiv.innerHTML = `<span style="color: #ef4444;">Resolution network error.</span>`;
        }
    }

    async function registerPasskey() {
        const handle = document.getElementById('regHandle').value.trim();
        const evm_address = document.getElementById('regEvm').value.trim();
        const solana_address = document.getElementById('regSol').value.trim();
        const okx_uid = document.getElementById('regOkx').value.trim();
        const statusDiv = document.getElementById('regStatus');

        if (!handle) {
            alert("Please enter a handle.");
            return;
        }

        statusDiv.classList.remove('hidden');
        statusDiv.innerHTML = "Prompting hardware Passkey authentication...";

        try {
            // Generate WebAuthn credential
            const challenge = new Uint8Array(32);
            window.crypto.getRandomValues(challenge);
            const userId = new Uint8Array(16);
            window.crypto.getRandomValues(userId);

            const publicKeyCredentialCreationOptions = {
                challenge: challenge,
                rp: { name: "Universal ID Protocol", id: window.location.hostname },
                user: {
                    id: userId,
                    name: handle,
                    displayName: `@${handle}`
                },
                pubKeyCredParams: [{ alg: -7, type: "public-key" }],
                timeout: 60000,
                attestation: "direct"
            };

            const credential = await navigator.credentials.create({
                publicKey: publicKeyCredentialCreationOptions
            });

            const credentialIdBase64 = btoa(String.fromCharCode(...new Uint8Array(credential.rawId)));

            statusDiv.innerHTML = "Saving handle to database...";

            const response = await fetch('/api/v1/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    handle,
                    owner_credential_id: credentialIdBase64,
                    passkey_public_key: "stored_passkey_placeholder",
                    evm_address: evm_address || null,
                    solana_address: solana_address || null,
                    okx_uid: okx_uid || null
                })
            });

            const data = await response.json();
            if (response.ok) {
                statusDiv.innerHTML = `<span style="color: #22c55e;">🎉 Successfully claimed @${data.handle} with Passkey!</span>`;
            } else {
                statusDiv.innerHTML = `<span style="color: #ef4444;">${data.error}</span>`;
            }
        } catch (err) {
            console.error(err);
            statusDiv.innerHTML = `<span style="color: #ef4444;">Passkey registration failed or cancelled.</span>`;
        }
    }

    async function linkWallet() {
        const handle = document.getElementById('linkHandle').value.trim();
        const chain_type = document.getElementById('linkChain').value.trim();
        const wallet_address = document.getElementById('linkAddress').value.trim();
        const statusDiv = document.getElementById('linkStatus');

        if (!handle || !chain_type || !wallet_address) {
            alert("Please fill in all fields.");
            return;
        }

        statusDiv.classList.remove('hidden');
        statusDiv.innerHTML = "Authenticating with Passkey to authorize link...";

        try {
            // Re-authenticate via Passkey to prove ownership before linking
            const challenge = new Uint8Array(32);
            window.crypto.getRandomValues(challenge);

            const assertion = await navigator.credentials.get({
                publicKey: { challenge: challenge, timeout: 60000, userVerification: "required" }
            });

            const credentialIdBase64 = btoa(String.fromCharCode(...new Uint8Array(assertion.rawId)));

            statusDiv.innerHTML = "Linking address to handle...";

            const response = await fetch('/api/v1/link-wallet', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    handle,
                    chain_type,
                    wallet_address,
                    owner_credential_id: credentialIdBase64
                })
            });

            const data = await response.json();
            if (response.ok) {
                statusDiv.innerHTML = `<span style="color: #22c55e;">✅ ${data.message}</span>`;
            } else {
                statusDiv.innerHTML = `<span style="color: #ef4444;">${data.error}</span>`;
            }
        } catch (err) {
            console.error(err);
            statusDiv.innerHTML = `<span style="color: #ef4444;">Authentication failed or cancelled.</span>`;
        }
    }
</script>

</body>
</html>
