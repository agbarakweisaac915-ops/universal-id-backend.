<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal ID - Exchange Withdrawal Integration</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .widget-card { background: #1e293b; padding: 30px; border-radius: 12px; width: 100%; max-width: 440px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid #334155; }
        h2 { margin-top: 0; font-size: 20px; color: #38bdf8; display: flex; align-items: center; gap: 10px; }
        label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; }
        .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
        input { flex: 1; background: #0f172a; border: 1px solid #475569; color: white; padding: 12px; border-radius: 6px; font-size: 15px; outline: none; transition: border 0.2s; }
        input:focus { border-color: #38bdf8; }
        button { background: #38bdf8; color: #0f172a; border: none; padding: 0 20px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #0ea5e9; }
        .result-box { background: #0f172a; border: 1px solid #334155; padding: 16px; border-radius: 6px; font-size: 13px; display: none; }
        .result-row { display: flex; justify-content: space-between; margin-bottom: 10px; word-break: break-all; gap: 10px; }
        .result-row:last-child { margin-bottom: 0; }
        .label-key { color: #94a3b8; min-width: 100px; }
        .label-val { color: #38bdf8; font-family: monospace; font-size: 12px; text-align: right; }
        .error-text { color: #f43f5e; font-size: 13px; margin-top: -10px; margin-bottom: 15px; display: none; }
    </style>
</head>
<body>

<div class="widget-card">
    <h2>⚡ Universal ID Routing</h2>
    <label>Withdrawal Recipient (@handle)</label>
    <div class="input-group">
        <input type="text" id="handleInput" placeholder="e.g. isaac">
        <button onclick="resolveHandle()">Resolve</button>
    </div>
    <div id="errorText" class="error-text"></div>

    <div id="resultBox" class="result-box">
        <div class="result-row"><span class="label-key">Handle:</span><span id="resHandle" class="label-val"></span></div>
        <div class="result-row"><span class="label-key">EVM Address:</span><span id="resEvm" class="label-val"></span></div>
        <div class="result-row"><span class="label-key">Solana:</span><span id="resSol" class="label-val"></span></div>
        <div class="result-row"><span class="label-key">OKX UID:</span><span id="resOkx" class="label-val"></span></div>
    </div>
</div>

<script>
    const API_BASE = 'https://universal-id-backend.onrender.com';

    async function resolveHandle() {
        const handle = document.getElementById('handleInput').value.trim().replace('@', '');
        const errorDiv = document.getElementById('errorText');
        const resultBox = document.getElementById('resultBox');
        
        errorDiv.style.display = 'none';
        resultBox.style.display = 'none';

        if (!handle) {
            errorDiv.innerText = "Please enter a valid handle.";
            errorDiv.style.display = 'block';
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/api/v1/resolve?handle=${encodeURIComponent(handle)}`);
            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Resolution failed");
            }

            document.getElementById('resHandle').innerText = '@' + data.handle;
            document.getElementById('resEvm').innerText = data.destinations.evm || 'N/A';
            document.getElementById('resSol').innerText = data.destinations.solana || 'N/A';
            document.getElementById('resOkx').innerText = data.destinations.okx_uid || 'N/A';
            
            resultBox.style.display = 'block';
        } catch (err) {
            errorDiv.innerText = err.message;
            errorDiv.style.display = 'block';
        }
    }
</script>

</body>
</html>
